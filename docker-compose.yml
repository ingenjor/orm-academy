version: '3.8'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ormacademy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
  app:
    build: .
    depends_on:
      - db
    environment:
      DB_URL: jdbc:postgresql://db:5432/ormacademy
    ports:
      - "8081:8081"